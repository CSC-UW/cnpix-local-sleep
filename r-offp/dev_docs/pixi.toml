[workspace]
authors = ["Graham Findlay <graham.b.findlay@gmail.com>"]
channels = ["conda-forge"]
name = "r-offp"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
quarto = ">=1.8.27,<2"
r-arrow = ">=22.0.0,<23"
r-assertthat = ">=0.2.1,<0.3"
r-base = ">=4.5.2,<4.6"
r-fastdummies = ">=1.7.5,<2"
r-jsonlite = ">=2.0.0,<3"
r-lme4 = ">=1.1_38,<2"
r-marginaleffects = ">=0.31.0,<0.32"
r-modelbased = ">=0.13.1,<0.14"
r-multcomp = ">=1.4_29,<2"
pandoc = ">=3,<4"
r-quarto = ">=1.5.1,<2"
r-rcolorbrewer = ">=1.1_3,<2"
r-rlang = ">=1.1.7,<2"
r-rmarkdown = ">=2.30,<3"
r-tidyverse = ">=2.0.0,<3"
r-here = ">=1.0.2,<2"

[feature.dev.dependencies]
r-devtools = ">=2.4.6,<3"
r-pak = ">=0.9.2,<0.10"
r-renv = ">=1.1.7,<2"
r-roxygen2 = ">=7.3.3,<8"
r-testthat = ">=3.3.2,<4"
r-usethis = ">=3.2.1,<4"
r-yaml = ">=2.3.12,<3"

[feature.vscode.dependencies]
radian = ">=0.6.15,<0.7"
r-httpgd = ">=2.0.4,<3"
r-languageserver = ">=0.3.16,<0.4"

[feature.vscode.tasks]
setup-vscode = "Rscript -e \"pak::pak('ManuelHentschel/vscDebugger')\""

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
vscode = { features = ["dev", "vscode"], solve-group = "default" }


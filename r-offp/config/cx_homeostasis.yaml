model_defaults:
  weighted_no_structure: &weighted_no_structure
    name: weighted_no_structure
    fe_terms: [condition]
    re_terms: ["(1 | subject)"]
    weighted: true
  crossed: &crossed
    name: crossed
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)"]
    weighted: false
  crossed_weighted: &crossed_weighted
    name: crossed_weighted
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)"]
    weighted: true
  crossed_interaction: &crossed_interaction
    name: crossed_interaction
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: false
  crossed_interaction_log: &crossed_interaction_log
    name: crossed_interaction_log
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: false
    transform: log
  crossed_interaction_sqrt: &crossed_interaction_sqrt
    name: crossed_interaction_sqrt
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: false
    transform: sqrt
  crossed_interaction_weighted: &crossed_interaction_weighted
    name: crossed_interaction_weighted
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: true
  crossed_interaction_weighted_log: &crossed_interaction_weighted_log
    name: crossed_interaction_weighted_log
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: true
    transform: log
  crossed_interaction_weighted_sqrt: &crossed_interaction_weighted_sqrt
    name: crossed_interaction_weighted_sqrt
    fe_terms: [condition]
    re_terms: ["(1 | subject)", "(1 | structure)", "(1 | subject:structure)"]
    weighted: true
    transform: sqrt
# TODO: Add an alternative to simple weighted models (which weight by the inverse
# of total variance). Instead fit an unweighted model, extract the residuals for 
# each group (which will have the random effects removed) and then use the per-group 
# residual variance as weights for a new model. 
# RATIONALE: Ideally, weights are proportional to inverse residual variance, but 
# inverse total variance combiens residual + random effect variance, which can 
# distort weights relative to an ideal weighting, and could explain why we often
# do not see equal residual variance across grops in weighted+transformed models.

# Condition sets bundle {name, conditions, posthocs} and are an axis orthogonal
# to off_type (llas/clas/blas). Each
# response variable selects one or more (condition_set x model) analyses below;
# a separate fit is produced per set (e.g. `wake` and `nrem` are independent
# fits, each with its own variance components, rather than a single `six` fit).
condition_sets:
  six: &cs_six
    name: six
    conditions:
      - Early.BSL.NREM
      - Early.REC.NREM.Match
      - Early.NOD.Wake
      - Late.NOD.Wake
      - Early.REC.NREM
      - Late.REC.NREM
    posthocs:
      - "Early.REC.NREM - Early.REC.NREM.Match = 0"
      - "Early.REC.NREM - Early.BSL.NREM = 0"
      - "Early.REC.NREM - Late.REC.NREM = 0"
      - "Early.BSL.NREM - Early.REC.NREM.Match = 0"
      - "Late.NOD.Wake - Early.NOD.Wake = 0"
  nrem: &cs_nrem
    name: nrem
    conditions:
      - Early.BSL.NREM
      - Early.REC.NREM.Match
      - Early.REC.NREM
      - Late.REC.NREM
    posthocs:
      - "Early.REC.NREM - Early.REC.NREM.Match = 0"
      - "Early.REC.NREM - Early.BSL.NREM = 0"
      - "Early.REC.NREM - Late.REC.NREM = 0"
      - "Early.BSL.NREM - Early.REC.NREM.Match = 0"
  wake: &cs_wake
    name: wake
    conditions:
      - Early.NOD.Wake
      - Late.NOD.Wake
    posthocs:
      - "Late.NOD.Wake - Early.NOD.Wake = 0"

# Each response variable lists `analyses`, a list of {condition_set, model}
# pairs. To fit a measure under multiple condition sets, add multiple entries
# (e.g. rate under both *cs_wake and *cs_nrem). Different models per set are
# allowed. Output nests under
#   _output/<dataset>/<condition_set>/<response_var>/<model>/
# Notes on annotations:
# - "Non-linearity" may sometimes be due to, or exacerbated by, a boundary effect / variance scale issue. 
datasets:
  llas:
    response_variables:
      - title: Median duration (s)
        response_variable: median_duration

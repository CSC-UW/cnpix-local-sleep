        analyses:
          #- {condition_set: *cs_nrem, model: *crossed_interaction} # Weakly non-linear; okay
          #- {condition_set: *cs_wake, model: *crossed_interaction} # Weakly heteroscedastic; okay
          #- {condition_set: *cs_six, model: *crossed_interaction} # Moderately heavy-tailed; boundary effect
          - {condition_set: *cs_six, model: *crossed_interaction_weighted} # Good; Pick me.
      - title: Median span (um)

          - {condition_set: *cs_six, model: *crossed_interaction_weighted} # Mild positive skew; good. Best of the *cs_six models. Pick me.
      #- title: Total area (s*um)
        #response_variable: total_area
        #analyses:
          #- {condition_set: *cs_nrem, model: *crossed_interaction} # Heavy-tailed; weakly heteroscedastic; Pick me.
          #- {condition_set: *cs_wake, model: *crossed_interaction} # Weak boundary effect; mildly heteroscedastic; Pick me.
          #- {condition_set: *cs_six, model: *crossed_interaction} # Heavy-tailed; hard boundary effect
          #- {condition_set: *cs_six, model: *crossed_interaction_weighted} # Positive skew; heteroscedastic; failed to converge
          #- {condition_set: *cs_six, model: *crossed_interaction_log} # Heavy-tailed; heteroscedastic
          #- {condition_set: *cs_six, model: *crossed_interaction_weighted_log} # Heavy-tailed; heteroscedastic
          #- {condition_set: *cs_six, model: *crossed_interaction_sqrt} # Heavy-tailed; hard boundary effect
          #- {condition_set: *cs_six, model: *crossed_interaction_weighted_sqrt} # Heavy-tailed; heteroscedastic
      - title: Rate (Hz)
        response_variable: rate
        analyses:
          - {condition_set: *cs_nrem, model: *crossed_interaction} # Good; Pick me.
          - {condition_set: *cs_wake, model: *crossed_interaction} # Mildly heteroscedastic; Pick me.
